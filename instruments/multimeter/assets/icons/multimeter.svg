<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100"
  height="100"
>
  <defs>
    <!-- Screen Gradient -->
    <linearGradient id="dmmScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <!-- Chassis Gradient -->
    <linearGradient id="dmmChassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283042" />
      <stop offset="100%" stop-color="#181e2b" />
    </linearGradient>
    <!-- Terminal Metallic Ring -->
    <radialGradient id="jackMetal" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <!-- Handle / Top Bracket -->
  <rect
    x="30"
    y="8"
    width="40"
    height="7"
    rx="3.5"
    fill="#334155"
    stroke="#475569"
    stroke-width="1.5"
  />
  <rect
    x="36"
    y="11"
    width="28"
    height="4"
    rx="2"
    fill="#0f172a"
    opacity="0.6"
  />

  <!-- Feet / Stand -->
  <rect x="14" y="85" width="14" height="6" rx="2" fill="#0f172a" />
  <rect x="72" y="85" width="14" height="6" rx="2" fill="#0f172a" />

  <!-- Main Enclosure / Body -->
  <rect
    x="6"
    y="13"
    width="88"
    height="74"
    rx="7"
    fill="url(#dmmChassisGrad)"
    stroke="#64748b"
    stroke-width="2.5"
  />

  <!-- Bezel Accent Stripe (Siglent Blue) -->
  <rect
    x="9"
    y="16"
    width="82"
    height="2"
    rx="1"
    fill="#0284c7"
    opacity="0.8"
  />

  <!-- ==================== DISPLAY SCREEN ==================== -->
  <rect
    x="10"
    y="21"
    width="44"
    height="36"
    rx="3"
    fill="#020617"
    stroke="#334155"
    stroke-width="1.5"
  />
  <rect
    x="12"
    y="23"
    width="40"
    height="32"
    rx="2"
    fill="url(#dmmScreenGrad)"
  />

  <!-- Top Status Bar in Screen -->
  <text x="14" y="27" fill="#94a3b8" font-size="2.2" font-family="sans-serif"
  >AUTO 6V</text>
  <text
    x="48"
    y="27"
    fill="#22c55e"
    font-size="2.2"
    font-family="sans-serif"
    text-anchor="end"
  >SLOW</text>

  <!-- Primary Reading -->
  <text
    x="32"
    y="39"
    fill="#38bdf8"
    font-size="6.5"
    font-family="monospace"
    font-weight="bold"
    text-anchor="middle"
  >+5.0000</text>
  <text
    x="49"
    y="39"
    fill="#38bdf8"
    font-size="3"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="end"
  >VDC</text>

  <!-- Secondary Reading -->
  <text
    x="14"
    y="47"
    fill="#facc15"
    font-size="2.5"
    font-family="monospace"
  >FREQ: 1.0000 kHz</text>

  <!-- Softkey Bar -->
  <rect x="13" y="50" width="7" height="3" rx="0.5" fill="#1e293b" />
  <rect x="21" y="50" width="7" height="3" rx="0.5" fill="#1e293b" />
  <rect x="29" y="50" width="7" height="3" rx="0.5" fill="#1e293b" />
  <rect x="37" y="50" width="7" height="3" rx="0.5" fill="#1e293b" />
  <rect x="44" y="50" width="6" height="3" rx="0.5" fill="#1e293b" />

  <!-- ==================== FUNCTION BUTTONS (BOTTOM LEFT) ==================== -->
  <rect x="10" y="60" width="6" height="4" rx="1" fill="#0284c7" />
  <text
    x="13"
    y="63"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >DCV</text>

  <rect x="18" y="60" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="21"
    y="63"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >ACV</text>

  <rect x="26" y="60" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="29"
    y="63"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >2W</text>

  <rect x="34" y="60" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="37"
    y="63"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >4W</text>

  <rect x="42" y="60" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="45"
    y="63"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >DCI</text>

  <rect x="10" y="66" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="13"
    y="69"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >ACI</text>

  <rect x="18" y="66" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="21"
    y="69"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >FRQ</text>

  <rect x="26" y="66" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="29"
    y="69"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >CONT</text>

  <rect x="34" y="66" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="37"
    y="69"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >DIOD</text>

  <rect x="42" y="66" width="6" height="4" rx="1" fill="#334155" />
  <text
    x="45"
    y="69"
    fill="#ffffff"
    font-size="1.8"
    font-family="sans-serif"
    text-anchor="middle"
  >MATH</text>

  <!-- Power Switch & Indicator (Bottom Left) -->
  <circle
    cx="13"
    cy="77"
    r="3"
    fill="#1e293b"
    stroke="#ef4444"
    stroke-width="1.2"
  />
  <circle cx="13" cy="77" r="1.5" fill="#ef4444" />
  <circle cx="21" cy="77" r="1.2" fill="#22c55e" />

  <!-- Navigation / Range Keys (Bottom Middle) -->
  <circle
    cx="34"
    cy="76"
    r="3.5"
    fill="#475569"
    stroke="#64748b"
    stroke-width="0.8"
  />
  <rect x="41" y="74.5" width="7" height="3.5" rx="1" fill="#475569" />
  <text
    x="44.5"
    y="77"
    fill="#ffffff"
    font-size="2"
    font-family="sans-serif"
    text-anchor="middle"
  >Auto</text>

  <!-- ==================== 5 INPUT TERMINALS (CENTERED VERTICALLY) ==================== -->
  <!-- Terminal Area Background Box Centered Vertically from y=21 to y=79 (Center y=50) -->
  <rect
    x="57"
    y="21"
    width="32"
    height="58"
    rx="4"
    fill="#111827"
    stroke="#334155"
    stroke-width="1.2"
  />

  <!-- Terminal Section Header -->
  <text
    x="73"
    y="27"
    fill="#94a3b8"
    font-size="2.4"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >INPUTS</text>

  <!-- 1. SENSE HI Terminal (Top Left: x=65, y=37) -->
  <circle
    cx="65"
    cy="37"
    r="4.2"
    fill="url(#jackMetal)"
    stroke="#ef4444"
    stroke-width="1.2"
  />
  <circle cx="65" cy="37" r="2.2" fill="#020617" />
  <circle cx="65" cy="37" r="1" fill="#ef4444" />
  <text
    x="65"
    y="44"
    fill="#ef4444"
    font-size="2"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >S-HI</text>

  <!-- 2. INPUT HI Terminal (Top Right: x=81, y=37) -->
  <circle
    cx="81"
    cy="37"
    r="4.2"
    fill="url(#jackMetal)"
    stroke="#ef4444"
    stroke-width="1.2"
  />
  <circle cx="81" cy="37" r="2.2" fill="#020617" />
  <circle cx="81" cy="37" r="1" fill="#ef4444" />
  <text
    x="81"
    y="44"
    fill="#ef4444"
    font-size="2"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >HI</text>

  <!-- 3. SENSE LO Terminal (Middle Left: x=65, y=52) -->
  <circle
    cx="65"
    cy="52"
    r="4.2"
    fill="url(#jackMetal)"
    stroke="#0f172a"
    stroke-width="1.2"
  />
  <circle cx="65" cy="52" r="2.2" fill="#020617" />
  <circle cx="65" cy="52" r="1" fill="#94a3b8" />
  <text
    x="65"
    y="59"
    fill="#94a3b8"
    font-size="2"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >S-LO</text>

  <!-- 4. INPUT LO Terminal (Middle Right: x=81, y=52) -->
  <circle
    cx="81"
    cy="52"
    r="4.2"
    fill="url(#jackMetal)"
    stroke="#0f172a"
    stroke-width="1.2"
  />
  <circle cx="81" cy="52" r="2.2" fill="#020617" />
  <circle cx="81" cy="52" r="1" fill="#94a3b8" />
  <text
    x="81"
    y="59"
    fill="#94a3b8"
    font-size="2"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >LO</text>

  <!-- 5. 10A CURRENT Terminal (Bottom Center: x=73, y=67) -->
  <circle
    cx="73"
    cy="67"
    r="4.2"
    fill="url(#jackMetal)"
    stroke="#ef4444"
    stroke-width="1.2"
  />
  <circle cx="73" cy="67" r="2.2" fill="#020617" />
  <circle cx="73" cy="67" r="1" fill="#ef4444" />
  <text
    x="73"
    y="74"
    fill="#ef4444"
    font-size="2"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >10A</text>
</svg>
