<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100"
  height="100"
>
  <defs>
    <!-- Screen Gradient -->
    <linearGradient id="scopeScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <!-- Chassis Gradient -->
    <linearGradient id="scopeChassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283042" />
      <stop offset="100%" stop-color="#181e2b" />
    </linearGradient>
    <!-- BNC Metallic Ring -->
    <radialGradient id="bncMetal" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
  </defs>

  <!-- Handle / Top Bracket -->
  <rect
    x="30"
    y="8"
    width="40"
    height="7"
    rx="3.5"
    fill="#334155"
    stroke="#475569"
    stroke-width="1.5"
  />
  <rect
    x="36"
    y="11"
    width="28"
    height="4"
    rx="2"
    fill="#0f172a"
    opacity="0.6"
  />

  <!-- Feet / Stand -->
  <rect x="14" y="85" width="14" height="6" rx="2" fill="#0f172a" />
  <rect x="72" y="85" width="14" height="6" rx="2" fill="#0f172a" />

  <!-- Main Enclosure / Body -->
  <rect
    x="6"
    y="13"
    width="88"
    height="74"
    rx="7"
    fill="url(#scopeChassisGrad)"
    stroke="#64748b"
    stroke-width="2.5"
  />

  <!-- Bezel Accent Stripe -->
  <rect
    x="9"
    y="16"
    width="82"
    height="2"
    rx="1"
    fill="#38bdf8"
    opacity="0.7"
  />

  <!-- ==================== DISPLAY SCREEN ==================== -->
  <rect
    x="11"
    y="21"
    width="53"
    height="43"
    rx="4"
    fill="#020617"
    stroke="#334155"
    stroke-width="2"
  />
  <rect
    x="13"
    y="23"
    width="49"
    height="39"
    rx="2"
    fill="url(#scopeScreenGrad)"
  />

  <!-- Grid / Graticule Lines -->
  <!-- Horizontal Grid -->
  <line
    x1="13"
    y1="31"
    x2="62"
    y2="31"
    stroke="#1e293b"
    stroke-width="0.7"
    stroke-dasharray="1.5,1.5"
  />
  <line
    x1="13"
    y1="42.5"
    x2="62"
    y2="42.5"
    stroke="#334155"
    stroke-width="0.9"
  />
  <line
    x1="13"
    y1="54"
    x2="62"
    y2="54"
    stroke="#1e293b"
    stroke-width="0.7"
    stroke-dasharray="1.5,1.5"
  />
  <!-- Vertical Grid -->
  <line
    x1="25.2"
    y1="23"
    x2="25.2"
    y2="62"
    stroke="#1e293b"
    stroke-width="0.7"
    stroke-dasharray="1.5,1.5"
  />
  <line
    x1="37.5"
    y1="23"
    x2="37.5"
    y2="62"
    stroke="#334155"
    stroke-width="0.9"
  />
  <line
    x1="49.8"
    y1="23"
    x2="49.8"
    y2="62"
    stroke="#1e293b"
    stroke-width="0.7"
    stroke-dasharray="1.5,1.5"
  />

  <!-- Center Crosshair Ticks -->
  <line
    x1="36.5"
    y1="42.5"
    x2="38.5"
    y2="42.5"
    stroke="#64748b"
    stroke-width="1"
  />
  <line
    x1="37.5"
    y1="41.5"
    x2="37.5"
    y2="43.5"
    stroke="#64748b"
    stroke-width="1"
  />

  <!-- Channel 1 Waveform (Sine Wave - Yellow #facc15) -->
  <path
    d="M 14 42.5 Q 20 28 26 42.5 T 38 42.5 T 50 42.5 T 61 42.5"
    fill="none"
    stroke="#facc15"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Channel 2 Waveform (Square/Clock Wave - Cyan #00f0ff) -->
  <path
    d="M 14 56 L 22 56 L 22 49 L 34 49 L 34 56 L 46 56 L 46 49 L 58 49 L 58 56 L 61 56"
    fill="none"
    stroke="#00f0ff"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Top Status Icons in Screen -->
  <rect x="15" y="24.5" width="6" height="2.5" rx="1" fill="#facc15" />
  <rect x="23" y="24.5" width="6" height="2.5" rx="1" fill="#00f0ff" />
  <!-- Trigger status dot -->
  <circle cx="58" cy="25.5" r="1.2" fill="#22c55e" />

  <!-- ==================== RIGHT CONTROL PANEL ==================== -->
  <!-- Run/Stop Button -->
  <rect
    x="69"
    y="21"
    width="21"
    height="5.5"
    rx="2"
    fill="#16a34a"
    stroke="#22c55e"
    stroke-width="1"
  />
  <text
    x="79.5"
    y="25"
    fill="#ffffff"
    font-size="3.2"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >RUN</text>

  <!-- Horizontal / Timebase Main Knob -->
  <circle
    cx="79.5"
    cy="34"
    r="5"
    fill="url(#bncMetal)"
    stroke="#94a3b8"
    stroke-width="1.2"
  />
  <circle cx="79.5" cy="34" r="3.2" fill="#1e293b" />
  <line
    x1="79.5"
    y1="30"
    x2="79.5"
    y2="33"
    stroke="#38bdf8"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- Channel Knobs: CH1 (Yellow) & CH2 (Cyan) -->
  <circle
    cx="74"
    cy="46"
    r="3.8"
    fill="url(#bncMetal)"
    stroke="#facc15"
    stroke-width="1.2"
  />
  <line
    x1="74"
    y1="43"
    x2="74"
    y2="45.5"
    stroke="#facc15"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <circle
    cx="85"
    cy="46"
    r="3.8"
    fill="url(#bncMetal)"
    stroke="#00f0ff"
    stroke-width="1.2"
  />
  <line
    x1="85"
    y1="43"
    x2="85"
    y2="45.5"
    stroke="#00f0ff"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Menu / Function Buttons -->
  <rect x="70.5" y="54" width="4.5" height="2.5" rx="0.8" fill="#475569" />
  <rect x="77.2" y="54" width="4.5" height="2.5" rx="0.8" fill="#475569" />
  <rect x="84" y="54" width="4.5" height="2.5" rx="0.8" fill="#475569" />

  <rect x="70.5" y="59" width="4.5" height="2.5" rx="0.8" fill="#475569" />
  <rect x="77.2" y="59" width="4.5" height="2.5" rx="0.8" fill="#ec4899" />
  <rect x="84" y="59" width="4.5" height="2.5" rx="0.8" fill="#475569" />

  <!-- ==================== BOTTOM CONNECTOR BAR ==================== -->
  <rect
    x="11"
    y="67"
    width="79"
    height="16"
    rx="3"
    fill="#111827"
    stroke="#1e293b"
    stroke-width="1.2"
  />

  <!-- CH1 BNC Connector -->
  <circle
    cx="21"
    cy="75"
    r="4.8"
    fill="url(#bncMetal)"
    stroke="#facc15"
    stroke-width="1.4"
  />
  <circle cx="21" cy="75" r="2.8" fill="#020617" />
  <circle cx="21" cy="75" r="1.1" fill="#facc15" />
  <text
    x="21"
    y="81.5"
    fill="#facc15"
    font-size="2.4"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >CH1</text>

  <!-- CH2 BNC Connector -->
  <circle
    cx="37"
    cy="75"
    r="4.8"
    fill="url(#bncMetal)"
    stroke="#00f0ff"
    stroke-width="1.4"
  />
  <circle cx="37" cy="75" r="2.8" fill="#020617" />
  <circle cx="37" cy="75" r="1.1" fill="#00f0ff" />
  <text
    x="37"
    y="81.5"
    fill="#00f0ff"
    font-size="2.4"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >CH2</text>

  <!-- EXT TRIG BNC Connector -->
  <circle
    cx="53"
    cy="75"
    r="4.8"
    fill="url(#bncMetal)"
    stroke="#94a3b8"
    stroke-width="1.4"
  />
  <circle cx="53" cy="75" r="2.8" fill="#020617" />
  <circle cx="53" cy="75" r="1.1" fill="#cbd5e1" />
  <text
    x="53"
    y="81.5"
    fill="#94a3b8"
    font-size="2.4"
    font-family="sans-serif"
    font-weight="bold"
    text-anchor="middle"
  >EXT</text>

  <!-- Probe Compensation / Calibrator Terminal -->
  <rect
    x="66"
    y="73"
    width="7"
    height="4.5"
    rx="1"
    fill="#1e293b"
    stroke="#475569"
    stroke-width="0.8"
  />
  <circle cx="68" cy="75.2" r="0.9" fill="#e2e8f0" />
  <circle cx="71" cy="75.2" r="0.9" fill="#64748b" />
  <text
    x="69.5"
    y="81.5"
    fill="#64748b"
    font-size="2.2"
    font-family="sans-serif"
    text-anchor="middle"
  >CAL</text>

  <!-- Power Button -->
  <circle
    cx="82.5"
    cy="75"
    r="3.2"
    fill="#1e293b"
    stroke="#ef4444"
    stroke-width="1.2"
  />
  <circle cx="82.5" cy="75" r="1.6" fill="#ef4444" />
</svg>
